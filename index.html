<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Khu vườn trên mây · KHTN 6</title>
  <meta name="description" content="Vương quốc Hóa học KHTN 6: học để trồng vườn, nhổ cỏ dại và xây nhà trên mây.">
  <meta name="theme-color" content="#bfe6ff">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☁️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
  { "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/+esm"
  } }
  </script>
</head>
<body>
  <div class="sky" aria-hidden="true"><span class="cloud c1"></span><span class="cloud c2"></span><span class="cloud c3"></span></div>
  <div id="world" aria-label="Vương quốc mây"></div>
  <div id="app"><p class="loading">☁️ Đang bay lên mây…</p></div>
  <noscript>Trình duyệt cần bật JavaScript để vào Khu vườn trên mây.</noscript>
  <script>
    // Nếu web không khởi động được (thiếu file, lỗi tải), hiện lời nhắn thay vì trang trắng
    (function () {
      var errs = [];
      function show() {
        if (window.__kvtmStarted) return;
        var a = document.getElementById("app");
        a.innerHTML = '<div style="max-width:560px;margin:12vh auto;padding:24px;background:#fff;border:2.5px solid #2a2550;border-radius:20px;box-shadow:0 6px 0 #2a2550;font-family:Nunito,sans-serif">' +
          '<h2 style="margin-top:0">☁️ Web chưa mở được</h2><p>Có thể trình duyệt đang giữ bản cũ, hoặc trên GitHub còn thiếu file.</p>' +
          '<ol><li>Bấm <b>Ctrl + F5</b> để tải lại.</li><li>Kiểm tra trên GitHub đã có đủ các file trong thư mục <b>js</b> và <b>data</b> của bản mới nhất.</li></ol>' +
          (errs.length ? '<p style="font-size:13px;color:#b0304a"><b>Lỗi:</b><br>' + errs.slice(0, 4).join("<br>") + '</p>' : '') + '</div>';
      }
      window.addEventListener("error", function (e) { var t = e.target && (e.target.src || e.target.href); errs.push(t ? "Không tải được: " + t : (e.message || "lỗi") + (e.filename ? " (" + e.filename.split("/").pop() + ")" : "")); setTimeout(show, 300); }, true);
      window.addEventListener("unhandledrejection", function (e) { errs.push(String(e.reason && e.reason.message || e.reason)); });
      setTimeout(show, 12000);
    })();
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
